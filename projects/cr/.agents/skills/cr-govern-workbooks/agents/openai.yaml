interface:
  display_name: "CR 源表治理"
  short_description: "分类 Cash Royal 策划源表、版本 Sheet 与配置输出边界"
  default_prompt: "Use $cr-govern-workbooks to audit and organize CR numerical workbooks safely."

# 模型提供商配置
model_providers:
  deepseek:
    provider: "deepseek"
    base_url: "https://api.deepseek.com/v1"
    api_key: "${DEEPSEEK_API_KEY}"
    model: "deepseek-chat"
    max_tokens: 8192
    temperature: 0.3

