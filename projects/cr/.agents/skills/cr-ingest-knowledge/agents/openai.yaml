interface:
  display_name: "CR 资料落库"
  short_description: "筛选、导入、归档并分类维护 Cash Royal 文档正文与附件资料"
  default_prompt: "Use $cr-ingest-knowledge to import and organize verified CR project documents."

# 模型提供商配置
model_providers:
  deepseek:
    provider: "deepseek"
    base_url: "https://api.deepseek.com/v1"
    api_key: "${DEEPSEEK_API_KEY}"
    model: "deepseek-chat"
    max_tokens: 8192
    temperature: 0.3

